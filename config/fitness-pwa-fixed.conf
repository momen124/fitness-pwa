server {
    server_name pwa.siwaway.com;
    root /var/www/fitness-pwa;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires max;
        log_not_found off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pwa.siwaway.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pwa.siwaway.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    listen 80;
    server_name pwa.siwaway.com;
    
    # Removed HTTPS redirect to support Cloudflare Flexible mode
    # if ($host = pwa.siwaway.com) {
    #     return 301 https://$host$request_uri;
    # }

    root /var/www/fitness-pwa;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
